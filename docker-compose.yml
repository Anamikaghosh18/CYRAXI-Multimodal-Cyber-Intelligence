version: "3.9"

# CYRAXI — Local Development Services
# Usage: docker compose up -d
# Neo4j Browser: http://localhost:7474  (user: neo4j / pass: cyraxi_dev)
# Bolt URI:      bolt://localhost:7687

services:
  neo4j:
    image: neo4j:5.20-community
    container_name: cyraxi-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser UI
      - "7687:7687"   # Bolt protocol (driver connection)
    environment:
      - NEO4J_AUTH=neo4j/cyraxi_dev
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
